[package]
name = "hfd"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "A small flat-file downloader for Hugging Face model artifacts"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
indicatif = "0.18"
inquire = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
toml = "1"
